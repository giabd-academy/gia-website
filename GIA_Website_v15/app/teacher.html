<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GIA App — Teacher</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2544">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GIA App">
<link rel="stylesheet" href="teacher.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="splash" class="splash"><div class="splRing"></div><div class="splRing r2"></div><img src="../logomark.png" alt="" onerror="this.src='icon-192.png'"><b>GIA Teacher</b><span>銀河国際アカデミー</span><i class="splBar"></i></div>
<section id="login" class="login">
  <div class="sakura" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="lcard">
    <div class="lbadge"><img src="../logomark.png" alt="GIA" onerror="this.src='icon-192.png'"></div>
    <h1>GIA Teacher</h1>
    <div class="jpsub">銀河国際アカデミー · 先生</div>
    <p class="sub" data-t="loginSub">Approve student attendance, batch-wise</p>
    <label data-t="email">Email</label>
    <input id="in_email" type="email" autocomplete="username" placeholder="teacher@gmail.com">
    <label data-t="pw">Password</label>
    <div class="pw"><input id="in_pw" type="password" autocomplete="current-password"><button type="button" id="pwEye">👁</button></div>
    <button id="btnLogin" class="btn" data-t="login">Log in</button>
    <div id="lerr" class="err"></div>
    <button id="btnForgot" class="link" data-t="forgot">Forgot password?</button>
    <p class="hint" data-t="hint">Use the email & password the office gave you. Never share your password.</p>
    <button class="lang" id="btnLang">EN / বাংলা</button>
    <a class="switch" href="./?choose=1">🎓 Student? Log in here →</a>
  </div>
</section>
<section id="main" class="main" hidden>
  <header class="top">
    <div class="tt"><b id="hName">—</b><span id="hSub"></span></div>
    <div class="live" id="live" title="Live">● LIVE</div>
    <button class="ib" id="btnBell" title="Notifications">🔔</button>
  </header>
  <div class="bar2">
    <input type="date" id="fDate">
    <div class="chips" id="chips"></div>
  </div>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</section>
<div id="zoom" class="zoom" hidden></div>
<button id="installBtn" class="install" hidden>📲 <span data-t="install">Install app</span></button>
<script src="teacher.js"></script>
</body>
</html>
