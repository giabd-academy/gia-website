<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galaxy International Academy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:rgba(0,0,0,0.6);
  position:sticky;
  top:0;
}

.logo img{
  height:45px;
}

/* BUTTON */
.btn{
  background:red;
  color:white;
  padding:10px 18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  text-decoration:none;
}

/* HERO */
.hero{
  height:90vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:url('https://images.unsplash.com/photo-1503899036084-c55cdd92da26') center/cover;
  position:relative;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.7);
}

.hero-content{
  position:relative;
}

/* SECTION */
.section{
  padding:60px 20px;
  text-align:center;
}

/* FORM */
form{
  max-width:400px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

input,textarea{
  padding:10px;
  border:none;
  border-radius:8px;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:15px 20px;
  border-radius:50px;
  color:white;
  text-decoration:none;
}
</style>

</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <img src="logo.jpeg" alt="Logo">
  </div>

  <a href="start.html" class="btn">Start Journey</a>
</header>

<!-- HERO -->
<section class="hero">
  <div class="overlay"></div>
  <div class="hero-content">
    <h1>Study in Japan 🇯🇵</h1>
    <p>Build Your Future with GIABD</p>
    <a href="start.html" class="btn">Start Journey</a>
  </div>
</section>

<!-- APPLY FORM -->
<section class="section">
  <h2>Apply Now</h2>

  <form id="applyForm" onsubmit="return false;">

    <input id="name" placeholder="Your Name" required>
    <input id="phone" placeholder="Phone Number" required>
    <input id="interest" placeholder="Interest">
    <textarea id="message" placeholder="Message"></textarea>

    <button type="button" class="btn" onclick="submitLead()">
      Apply Now
    </button>

  </form>
</section>

<!-- FOOTER -->
<footer style="text-align:center;padding:20px;color:gray;">
Galaxy International Academy © 2026
</footer>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/8801830150171">
WhatsApp
</a>

<!-- JS FILE -->
<script src="script.js"></script>

</body>
</html>
