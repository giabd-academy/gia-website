<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Student ID — Galaxy International Academy</title><meta name="robots" content="noindex">
<link rel="icon" href="../favicon.png">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",Roboto,sans-serif;background:radial-gradient(circle at 30% 10%,#1f3c6b,#0b1a33 70%);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(420px,100%);background:#fff;color:#16233a;border-radius:24px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45);animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(20px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.top{background:linear-gradient(120deg,#0f2544,#1f3c6b);color:#fff;padding:18px;display:flex;gap:12px;align-items:center}.top img{width:52px;height:52px;border-radius:50%;background:#fff}.top b{display:block}.top small{color:#e8c77a;letter-spacing:2px;font-size:.72rem}
.st{margin:16px;padding:14px;border-radius:16px;text-align:center;font-weight:800;font-size:1.05rem}.ok{background:#e3f6ee;color:#13704b}.bad{background:#fde4e1;color:#c0392b}.wait{background:#eef0f3;color:#6b7280}
.body{display:flex;gap:16px;padding:4px 18px 18px;align-items:center}.ph{width:110px;height:138px;border-radius:16px;object-fit:cover;background:#eef0f3;border:3px solid #c9a24a;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:#0f2544}
.kv{font-size:.85rem;line-height:1.7}.kv span{color:#6b7280;font-size:.72rem;display:block;margin-top:2px}.nm{font-size:1.2rem;font-weight:800;color:#0f2544}
.foot{background:#f6f3ec;color:#6b7280;font-size:.75rem;text-align:center;padding:12px}
.tick{font-size:2.4rem;display:block;animation:tk .6s .2s both cubic-bezier(.2,1.6,.4,1)}@keyframes tk{from{transform:scale(0)}to{transform:none}}
</style></head><body>
<div class="card">
  <div class="top"><img src="../logomark.png" alt=""><div><b>Galaxy International Academy</b><small>STUDENT ID VERIFICATION</small></div></div>
  <div id="st" class="st wait">Checking…</div>
  <div id="body"></div>
  <div class="foot">This page reads the live record from GIA's system. Questions: +880 1830-150171 · giabd.com</div>
</div>
<script>
(function(){
  var CFG={apiKey:"AIzaSyAQRyQkxjAWEwgh5nn11Bmo72ke9-bYciQ",authDomain:"gia-erp.firebaseapp.com",projectId:"gia-erp",storageBucket:"gia-erp.firebasestorage.app",messagingSenderId:"951435359568",appId:"1:951435359568:web:347edd9a6364611e83e855"};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  var st=document.getElementById("st"),bd=document.getElementById("body");
  var c=(new URLSearchParams(location.search).get("c")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  function bad(m){st.className="st bad";st.innerHTML='<span class="tick">✖</span>'+esc(m);}
  if(c.length<8){bad("Invalid or missing verification code");return;}
  try{
    var app=firebase.initializeApp(CFG);var f=firebase.firestore(app);
    f.collection("id_verify").doc(c).get().then(function(s){
      if(!s.exists){bad("Not found — this ID is not issued by GIA");return;}
      var d=s.data(),today=new Date().toISOString().slice(0,10),expired=d.validTill&&d.validTill<today,ok=d.status==="Active"&&!expired;
      st.className="st "+(ok?"ok":"bad");st.innerHTML='<span class="tick">'+(ok?"✔":"✖")+'</span>'+(ok?"VERIFIED — Active GIA student":(expired?"ID expired":"Not active ("+esc(d.status)+")"));
      bd.innerHTML='<div class="body">'+(d.photo?'<img class="ph" src="'+d.photo+'" alt="">':'<div class="ph">'+esc((d.name||"?").charAt(0))+'</div>')+'<div class="kv"><div class="nm">'+esc(d.name)+'</div><span>Student ID</span><b>'+esc(d.sid)+'</b><span>Course · Batch</span>'+esc([d.course,d.batch].filter(Boolean).join(" · ")||"—")+'<span>Valid till</span>'+esc(d.validTill||"—")+'</div></div>';
    }).catch(function(){bad("Could not connect — try again");});
  }catch(e){bad("Could not connect");}
})();
</script>
</body></html>
